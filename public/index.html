<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>พร้อมทิ้ง</title>
  <link rel="promptting icon" href="assets/icons/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
      overflow: hidden;
      background: #ccc;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    :root {
      --sab: env(safe-area-inset-bottom, 0px);
    }

    #app {
      position: relative;
      width: 100vw;
      height: var(--appH, 100dvh);
      min-height: var(--appH, 100vh);
      overflow: hidden;
    }

    /* ─── MAP ─── */
    #map {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .leaflet-control-attribution {
      opacity: 0.5;
    }

    .leaflet-control-zoom { display: none !important; }

    /* ─── TOP BAR ─── */
    #topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 500;
      background: #0ba06b;
      padding: max(10px, env(safe-area-inset-top)) clamp(14px, 2.5vw, 24px) 10px;
    }
    #topbar .lbl-small {
      font-size: 11.5px;
      color: #aaeece;
      line-height: 1.3;
    }
    #topbar .score-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    #topbar .score-num {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }
    #topbar .score-exp {
      font-size: 15px;
      font-weight: 700;
      color: #cff5e3;
      letter-spacing: 1px;
    }
    #topbar .lv-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }
    #topbar .lv-text {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }
    #topbar .bar-bg {
      flex: 1;
      height: 9px;
      background: rgba(255,255,255,0.26);
      border-radius: 99px;
      overflow: hidden;
    }
    #topbar .bar-fill {
      height: 100%;
      width: 53%;
      background: #fff;
      border-radius: 99px;
    }
    #topbar .lv-next {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    /* ─── RIGHT SIDE BUTTONS ─── */
    #right-btns {
      position: absolute;
      right: clamp(8px, 2vw, 22px);
      top: clamp(138px, 18vh, 182px);
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.2vw, 14px);
    }
    .rbtn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .rbtn-circle {
      width: clamp(52px, 7.5vw, 66px);
      height: clamp(52px, 7.5vw, 66px);
      border-radius: 50%;
      background: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .rbtn:active .rbtn-circle { transform: scale(0.93); }
    .rbtn-circle { transition: transform 0.1s; }
    .rbtn-label {
      font-size: clamp(10px, 1.5vw, 12px);
      font-weight: 600;
      color: #111;
      text-align: center;
    }

    /* ─── BOTTOM ─── */
    #bottom-wrap {
      position: absolute;
      bottom: clamp(14px, 2.8vh, 28px);
      left: 0; right: 0;
      z-index: 500;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 clamp(12px, 2.5vw, 24px) max(0px, env(safe-area-inset-bottom));
    }

    #qr-btn {
      width: clamp(78px, 11vw, 96px);
      height: clamp(78px, 11vw, 96px);
      border-radius: clamp(16px, 2.2vw, 22px);
      background: #1b9e57;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.28);
      cursor: pointer;
    }

    #mybin-btn {
      position: absolute;
      right: clamp(8px, 1.6vw, 16px);
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
    }
    #mybin-btn .icon-box {
      width: clamp(52px, 7vw, 62px);
      height: clamp(52px, 7vw, 62px);
      background: none;
      border-radius: 15px;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    #mybin-btn:active .icon-box { transform: scale(0.93); }
    #mybin-btn span {
      font-size: clamp(10px, 1.4vw, 11.5px);
      font-weight: 600;
      color: #111;
    }

    @media (max-width: 420px) {
      #right-btns {
        top: 132px;
      }
    }

    @media (min-width: 960px) {
      #topbar .score-num {
        font-size: 36px;
      }

      #topbar .score-exp {
        font-size: 16px;
      }

      #topbar .lv-text,
      #topbar .lv-next {
        font-size: 13px;
      }
    }

    .mwrap {
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .mwrap img { position: relative; z-index: 1; }

    /* ─── PWA BANNER ─── */
    #pwa-install-banner {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: white;
      z-index: 9999;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      padding: 16px;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .pwa-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pwa-icon img {
      border-radius: 8px;
    }

    .pwa-text {
      flex: 1;
    }

    .pwa-title {
      font-weight: 700;
      font-size: 14px;
      color: #333;
    }

    .pwa-desc {
      font-size: 12px;
      color: #666;
    }

    #pwa-install-btn {
      background: #0ba06b;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    #pwa-close-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: #999;
      padding: 4px;
      margin-left: 5px;
      cursor: pointer;
    }

    /* ════════════════════════════════
       BOTTOM SHEET POPUP SYSTEM
       (สำหรับ alertLowAccuracyWarning และ alert อื่นๆ)
    ════════════════════════════════ */
    #sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: var(--sab);
    }
    #sheet-overlay.visible {
      display: flex;
      animation: sheetOverlayIn 0.22s ease;
    }

    @keyframes sheetOverlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .sheet-popup-sheet {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 540px;
      padding: 8px 24px 32px;
      animation: sheetUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: bottom center;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .sheet-handle {
      width: 40px; height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin: 10px auto 20px;
    }

    .sheet-icon-wrap {
      width: 72px; height: 72px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .sheet-icon-wrap.blue   { background: #E3F2FD; }
    .sheet-icon-wrap.red    { background: #FFEBEE; }
    .sheet-icon-wrap.orange { background: #FFF3E0; }
    .sheet-icon-wrap.amber  { background: #FFFDE7; }
    .sheet-icon-wrap.purple { background: #EDE7F6; }
    .sheet-icon-wrap svg { width: 38px; height: 38px; }

    .sheet-title {
      font-size: 19px;
      font-weight: 700;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.35;
      font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
    }
    .sheet-body {
      font-size: 14px;
      color: #555;
      text-align: center;
      line-height: 1.65;
      margin-bottom: 24px;
      font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
    }
    .sheet-body b { color: #1a1a1a; font-weight: 700; }

    .sheet-btn-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sheet-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .sheet-btn:active { opacity: 0.8; transform: scale(0.98); }
    .sheet-btn.primary   { background: #0ba06b; color: #fff; }
    .sheet-btn.secondary { background: #F5F5F5; color: #333; }
    .sheet-btn.ghost     { background: transparent; color: #888; font-weight: 500; font-size: 14px; padding: 10px; }

    /* แอนิเมชันเด้งไปมา (Fast Bounce) */
@keyframes fastBounceIn {
  0% {
    transform: scale(0.3);
    opacity: 0;
  }
  40% {
    transform: scale(1.1);
    opacity: 1;
  }
  60% {
    transform: scale(0.9);
  }
  80% {
    transform: scale(1.03);
  }
  100% {
    transform: scale(1);
  }
}

/* คลาสที่จะเอาไปใช้กับ #popup-container */
.popup-bounce {
  animation: fastBounceIn 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
  </style>
</head>

<script>
// Map centered on Phuket town area (similar satellite view in screenshot)
const map = L.map('map', {
  center: [8.005, 98.335],
  zoom: 15,
  zoomControl: false,
  attributionControl: true,
  dragging: true,
  touchZoom: true,
  scrollWheelZoom: false
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  opacity: 1,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// Bin icon builder
function makeBinIcon(binType) {
  const imgW = 68, imgH = 80;
  const img = `<img src="assets/binsyms/${binType}.png" alt="Trash Icon" width="${imgW}" height="${imgH}">`;
  const html = `<div class="mwrap" style="width:${imgW}px;height:${imgH}px;">${img}</div>`;
  return L.divIcon({
    html,
    className: '',
    iconSize: [imgW, imgH],
    iconAnchor: [imgW / 2, imgH]
  });
}

// Place markers (positions approximate to match screenshot layout)
L.marker([8.0108, 98.3278], { icon: makeBinIcon('normal') }).addTo(map);
L.marker([8.0065, 98.3325], { icon: makeBinIcon('dangerous') }).addTo(map);
L.marker([7.9995, 98.3252], { icon: makeBinIcon('organic') }).addTo(map);
L.marker([7.9990, 98.3395], { icon: makeBinIcon('recycle') }).addTo(map);
</script>

<script>
  const progressDom = {
    scoreNumEl: document.querySelector('#topbar .score-num'),
    lvTextEl: document.querySelector('#topbar .lv-text'),
    lvNextEl: document.querySelector('#topbar .lv-next'),
    barFillEl: document.querySelector('#topbar .bar-fill')
  };

  const progressAnimState = {
    currentTotalExp: Number.isFinite(Number(progressDom.scoreNumEl?.textContent))
      ? Number(progressDom.scoreNumEl.textContent)
      : 0,
    rafId: null
  };

  function clamp01(v) {
    if (v < 0) return 0;
    if (v > 1) return 1;
    return v;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function setProgressUI(totalExp) {
    const safeTotal = Math.max(0, Math.round(Number(totalExp) || 0));
    const lv = Math.floor(safeTotal / 100);
    const expInLevel = safeTotal % 100;
    const barPercent = (expInLevel / 100) * 100;

    if (progressDom.scoreNumEl) progressDom.scoreNumEl.textContent = String(safeTotal);
    if (progressDom.lvTextEl) progressDom.lvTextEl.textContent = `LV ${lv}`;
    if (progressDom.lvNextEl) progressDom.lvNextEl.textContent = String(lv + 1);
    if (progressDom.barFillEl) progressDom.barFillEl.style.width = `${barPercent}%`;

    progressAnimState.currentTotalExp = safeTotal;
  }

  function progressUpdateSmoother(currentExpLabel, { durationMs = 3000 } = {}) {
    const target = Math.max(0, Math.round(Number(currentExpLabel) || 0));
    const start = Math.max(
      0,
      Math.round(
        Number.isFinite(progressAnimState.currentTotalExp)
          ? progressAnimState.currentTotalExp
          : Number(progressDom.scoreNumEl?.textContent) || 0
      )
    );

    if (progressAnimState.rafId != null) {
      cancelAnimationFrame(progressAnimState.rafId);
      progressAnimState.rafId = null;
    }

    if (durationMs <= 0 || start === target) {
      setProgressUI(target);
      return;
    }

    const startTs = performance.now();
    const tick = (now) => {
      const t = clamp01((now - startTs) / durationMs);
      const easedT = easeOutCubic(t);
      const value = start + (target - start) * easedT;
      setProgressUI(value);

      if (t < 1) {
        progressAnimState.rafId = requestAnimationFrame(tick);
      } else {
        progressAnimState.rafId = null;
        setProgressUI(target);
      }
    };

    progressAnimState.rafId = requestAnimationFrame(tick);
  }

  window.progressUpdateSmoother = progressUpdateSmoother;
  setProgressUI(progressAnimState.currentTotalExp);
</script>

<script>
const _popupCache = {};

function scopePopupCssToOverlay(cssText) {
  const scope = '#popup-overlay';
  let css = String(cssText || '');
  css = css.replace(/(^|[^\w-])body([^\w-])/g, `$1${scope}$2`);
  css = css.replace(/(^|[^\w-])html([^\w-])/g, `$1${scope}$2`);
  css = css.replace(/(^|[,{]\s*)\*(\s*[{,])/g, `$1${scope} *$2`);
  css = css.replace(/(^|[,{]\s*)\*\s*::before(\s*[{,])/g, `$1${scope} *::before$2`);
  css = css.replace(/(^|[,{]\s*)\*\s*::after(\s*[{,])/g, `$1${scope} *::after$2`);
  return css;
}

async function openPopup(popupId) {
  const overlay = document.getElementById('popup-overlay');
  const container = document.getElementById('popup-container');

  if (!_popupCache[popupId]) {
    const res = await fetch(`ui/popup/${popupId}/${popupId}.html`);
    const html = await res.text();
    _popupCache[popupId] = html;
  }

  container.innerHTML = '';

  const parser = new DOMParser();
  const doc = parser.parseFromString(_popupCache[popupId], 'text/html');

  [...doc.head.querySelectorAll('style, link[rel="stylesheet"]')].forEach(node => {
    const imported = document.importNode(node, true);
    if (imported.nodeName === 'STYLE') {
      imported.textContent = scopePopupCssToOverlay(imported.textContent);
    }
    container.appendChild(imported);
  });

  [...doc.body.childNodes].forEach(node => {
    if (node.nodeName === 'SCRIPT') {
      const script = document.createElement('script');
      script.innerHTML = node.innerHTML;
      container.appendChild(script);
    } else {
      container.appendChild(document.importNode(node, true));
    }
  });

  container.classList.remove('popup-bounce');
  void container.offsetWidth; // ทริค (Reflow) เพื่อบังคับให้เบราว์เซอร์รีเซ็ตแอนิเมชันทันที
  container.classList.add('popup-bounce');
  overlay.style.display = 'flex';
  try { window.updateAppHeight?.('popup.open'); } catch (_) {}
}

function closePopup() {
  const overlay = document.getElementById('popup-overlay');
  overlay.style.display = 'none';

  // เรียก cleanup ที่ popup ลงทะเบียนไว้
  if (typeof window.__popupCleanup === 'function') {
    window.__popupCleanup();
    window.__popupCleanup = null;
  }

  try { window.updateAppHeight?.('popup.close'); } catch (_) {}
}
</script>

<script>
  (function () {
    function computeAppHeightPx() {
      return Math.round(window.visualViewport?.height ?? window.innerHeight);
    }

    window.updateAppHeight = function updateAppHeight() {
      try {
        const h = computeAppHeightPx();
        document.documentElement.style.setProperty('--appH', `${h}px`);
      } catch (_) {}
    };

    window.addEventListener('load', window.updateAppHeight);
    window.addEventListener('resize', window.updateAppHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', window.updateAppHeight);
      window.visualViewport.addEventListener('scroll', window.updateAppHeight);
    }
  })();
</script>

  function openTrashSuccess() {
  openPopup('success');

  // 1. เตรียมรูปทรงขยะ (เอามาแค่ไม่กี่อย่างเพื่อลดโหลด)
  const trashShapes = [
    confetti.shapeFromText({ text: '🍌', scalar: 3 }), // เปลือกกล้วย (ขยะเปียก/อินทรีย์) - ดูเรียลกว่าแอปเปิ้ลเยอะครับ
    confetti.shapeFromText({ text: '🥤', scalar: 3 }), // แก้วน้ำพลาสติก (ขยะพลาสติก) - แทนขวดนม
    confetti.shapeFromText({ text: '🥫', scalar: 3 }), // กระป๋องใช้แล้ว (ขยะรีไซเคิล/โลหะ)
    confetti.shapeFromText({ text: '📦', scalar: 3 }), // กล่องกระดาษ (ขยะรีไซเคิล)
    confetti.shapeFromText({ text: '📄', scalar: 3 })  // เศษกระดาษ
  ];

  const duration = 3 * 1000;
  const animationEnd = Date.now() + duration;

  (function frame() {
    const timeLeft = animationEnd - Date.now();
    if (timeLeft <= 0) return;

    // ยิงจากฝั่งซ้าย (x: 0) และขวา (x: 1)
    [0, 1].forEach((side) => {
      // --- ส่วนที่ 1: เศษกระดาษธรรมดา (ยิงทุกเฟรม ตัวเล็ก ลื่นไหล) ---
      confetti({
        particleCount: 2,           // ยิงทีละนิดแต่ยิงถี่ๆ จะดูฟุ้งสวย
        angle: side === 0 ? 60 : 120,
        spread: 55,
        origin: { x: side, y: 0.7 },
        colors: ['#0ba06b', '#ffffff', '#f9a825'], // สีประจำแอป
        scalar: 0.7,                // ขนาดเล็ก ประมวลผลเร็ว
        zIndex: 1001
      });

      // --- ส่วนที่ 2: อีโมจิขยะ (สุ่มยิง นานๆ มาที เพื่อไม่ให้กระตุก) ---
      if (Math.random() > 0.92) {   // มีโอกาสแค่ประมาณ 8% ในแต่ละเฟรมที่จะมีขยะออกมา
        confetti({
          particleCount: 1,         // ออกมาทีละ 1 ชิ้นพอ
          angle: side === 0 ? 60 : 120,
          spread: 40,
          origin: { x: side, y: 0.7 },
          shapes: [trashShapes[Math.floor(Math.random() * trashShapes.length)]],
          scalar: 2.5,               // ตัวขยะให้ใหญ่หน่อยจะได้เห็นชัด
          zIndex: 1001,
          gravity: 1.2              // ขยะดูมีน้ำหนัก ตกเร็วกว่าเศษกระดาษนิดนึง
        });
      }
    });

    requestAnimationFrame(frame);
  }());
}

</script>

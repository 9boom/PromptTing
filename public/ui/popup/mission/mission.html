<script>

  document.querySelectorAll('.action-btn').forEach((button) => {

      const missionID = button.dataset.missionId;

      if (status === 'done') {
        return;
      }

      if (status === 'reward') {
        processReward();
        updateUIMissionDone(missionID);
        return;
      }

      if (status === 'normal') {
        document.querySelectorAll('.action-btn').forEach((targetButton) => {
          const targetMissionID = targetButton.dataset.missionId;

          if (
            targetMissionID !== missionID &&
            targetButton.dataset.status === 'in-progress'
          ) {
            updateUIMissionInNormal(targetMissionID);
          }
        });

        handleMissionID(missionID);
        updateUIMissionInProgress(missionID);
      }
    });
  });

    );

    button.dataset.status = 'done';
